server {
  listen 8080;
  listen 3000;
  server_name localhost;

  root /app;

  # Files under /_next/static/ have a content hash in their name: they never
  # change, so browsers can keep them for good.
  # `add_header` is not inherited when a location defines its own.
  location /_next/static/ {
      try_files $uri =404;

      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Frame-Options DENY always;
  }

  # Everything else (HTML pages, service-worker.js, public files) has a stable
  # name: the browser must revalidate it, so that it always gets the chunk list
  # of the current release and the latest service worker.
  location / {
      try_files $uri index.html $uri/index.html =404;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  # Collaborators: the animated product demo (public/demo/index.html, a copy
  # of demo.html at the repository's root), also without the final slash
  location = /demo {
      return 301 /demo/;
  }

  # Collaborators: a page lives at /page/<id>/
  location ~ "^/page/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /page/[id]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  # ... a space at /space/<id>/, a workspace's home at /workspace/<id>/
  location ~ "^/space/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /space/[id]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  location ~ "^/workspace/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /workspace/[id]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  # ... and its former address, in older links and emails, leads there (the
  # browser keeps any #anchor)
  location ~ "^/docs/([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/?$" {
      # relative: this server sits behind the router, on another port
      absolute_redirect off;
      return 301 /page/$1/$is_args$args;
  }

  location ~ "^/user-reconciliations/(active|inactive)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /user-reconciliations/$1/[id]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  # Collaborators: public wikis, and workspace settings
  location ~ "^/wiki/[a-z0-9-]+/?$" {
      try_files $uri /wiki/[slug]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  location ~ "^/wiki/[a-z0-9-]+/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /wiki/[slug]/[pageId]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  location ~ "^/workspaces/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/settings/?$" {
      try_files $uri /workspaces/[id]/settings/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  location ~ "^/join/[A-Za-z0-9_-]+/?$" {
      try_files $uri /join/[token]/index.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  # Collaborators: a wiki read at its own address — <workspace>.<base
  # domain>/<wiki>/<page>/ or a wiki's own domain /<page>/ — is shown by the
  # app itself, which tells it from the address; these paths exist on no app
  # route, so any page of the app does
  location ~ "^/[a-z0-9-]+/([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?)?$" {
      try_files $uri $uri/index.html /404.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  location ~ "^/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /404.html;

      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
  }

  error_page 404 /404.html;
  location = /404.html {
      internal;
  }
}
